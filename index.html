<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Punto de Venta</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; }
    h1 { color: #333; text-align: center; margin-bottom: 10px; }
    .status { text-align: center; padding: 8px; font-weight: bold; margin-bottom: 20px; border-radius: 5px; transition: all 0.3s ease; }
    .online { background: #d4edda; color: #155724; }
    .offline { background: #f8d7da; color: #721c24; }
    .grid { display: flex; gap: 20px; flex-wrap: wrap; }
    .col { flex: 1; min-width: 280px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .product-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; align-items: center; }
    .product-item.out-of-stock { opacity: 0.55; background-color: #f9f9f9; }
    button { background: #28a745; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:disabled { background: #6c757d !important; cursor: not-allowed; opacity: 0.6; }
    button.btn-blue { background: #007bff; }
    button.btn-whatsapp { background: #25D366; width: 100%; margin-top: 10px; padding: 12px; font-size: 16px; }
    input, select { width: 100%; padding: 8px; margin: 5px 0 12px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    ul { list-style: none; padding: 0; }
    li { padding: 6px 0; border-bottom: 1px solid #eee; }
    .material-text { color: #555; font-weight: normal; font-style: italic; }
    .badge-agotado { color: #dc3545; font-weight: bold; font-size: 12px; margin-left: 5px; }
    #modal-login { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .login-box { background: white; padding: 30px; border-radius: 10px; text-align: center; max-width: 350px; width: 90%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="modal-login">
    <div class="login-box">
      <h2>🔒 Acceso Requerido</h2>
      <p>Ingresa el PIN de seguridad para acceder al punto de venta:</p>
      <input type="password" id="pin-input" placeholder="Ingresa tu PIN" style="text-align:center; font-size: 18px;">
      <button class="btn-blue" style="width:100%; padding: 10px; font-size: 16px;" onclick="validarPin()">Ingresar</button>
      <p id="login-error" style="color: red; display: none; margin-top: 10px; font-weight: bold;">PIN incorrecto. Inténtalo de nuevo.</p>
    </div>
  </div>

  <div id="app-content" class="hidden">
    <h1>Punto de Venta</h1>
    <div id="status" class="status online">🟢 En línea</div>

    <div class="grid">
      <div class="col">
        <h2>📦 Gestión de Inventario</h2>
        <label>ID o Código:</label>
        <input type="text" id="prod-id" placeholder="Ej: 101">
        <label>Nombre del Producto:</label>
        <input type="text" id="prod-nombre" placeholder="Ej: Anillo Broquel">
        <label>Material:</label>
        <select id="prod-material">
          <option value="Plata ley 925">Plata ley 925</option>
          <option value="Oro 10K">Oro 10K</option>
          <option value="Oro">Oro</option>
          <option value="Plata">Plata</option>
          <option value="Acero">Acero</option>
          <option value="Fantasía / Otro">Fantasía / Otro</option>
        </select>
        <label>Precio ($):</label>
        <input type="number" id="prod-precio" placeholder="Ej: 38">
        <label>Stock Total Actualizado:</label>
        <input type="number" id="prod-stock" placeholder="Ej: 10">
        <button class="btn-blue" style="width:100%; padding:10px;" onclick="guardarProducto()">💾 Guardar / Actualizar Producto</button>
      </div>

      <div class="col">
        <h2>🛒 Catálogo</h2>
        <div style="background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 15px;">
          <label><strong>🔍 Buscar por Nombre o ID:</strong></label>
          <input type="text" id="filtro-nombre" placeholder="Escribe para buscar..." oninput="filtrarProductos()">
          <label><strong>💎 Filtrar por Material:</strong></label>
          <select id="filtro-material" onchange="filtrarProductos()">
            <option value="TODOS">Todos los materiales</option>
            <option value="Plata ley 925">Plata ley 925</option>
            <option value="Oro 10K">Oro 10K</option>
            <option value="Oro">Oro</option>
            <option value="Plata">Plata</option>
            <option value="Acero">Acero</option>
            <option value="Fantasía / Otro">Fantasía / Otro</option>
          </select>
        </div>
        <button onclick="cargarProductos()">🔄 Cargar / Actualizar Lista</button>
        <div id="lista-productos" style="margin-top:15px;"></div>
      </div>

      <div class="col">
        <h2>📋 Carrito de Compra</h2>
        <ul id="carrito"></ul>
        <h3>Total: $<span id="total">0</span></h3>
        <label>Teléfono Cliente (WhatsApp):</label>
        <input type="text" id="telefono" placeholder="Ej: 521234567890">
        <button class="btn-whatsapp" onclick="completarVenta()">🛒 Finalizar Venta y Enviar Ticket</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://google.com";
    const API_KEY = "477$inLimite"; 

    let productos = [];
    let carrito = [];

    document.addEventListener("DOMContentLoaded", () => {
      const auth = localStorage.getItem("pos_authenticated");
      if (auth === "true") mostrarSistema();
      actualizarEstado();
    });

    function validarPin() {
      if (document.getElementById("pin-input").value === API_KEY) {
        localStorage.setItem("pos_authenticated", "true");
        mostrarSistema();
      } else {
        document.getElementById("login-error").style.display = "block";
      }
    }

    function mostrarSistema() {
      document.getElementById("modal-login").classList.add("hidden");
      document.getElementById("app-content").classList.remove("hidden");
      cargarProductos();
    }

    window.addEventListener('online', actualizarEstado);
    window.addEventListener('offline', actualizarEstado);

    function actualizarEstado() {
      const status = document.getElementById('status');
      if (navigator.onLine) {
        status.className = "status online";
        status.innerText = "🟢 En línea";
        sincronizarDatosPendientes();
      } else {
        status.className = "status offline";
        status.innerText = "🔴 Modo Offline (Sin Internet)";
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log("SW error:", err));
    }

    async function cargarProductos() {
      if (navigator.onLine) {
        try {
          // Usamos un truco de redirección para saltar el bloqueo CORS de Google
          const res = await fetch(`${API_URL}?action=getProducts&key=${API_KEY}`);
          const data = await res.json();
          if (data.error) { alert("Error: " + data.error); return; }
          productos = data;
          localStorage.setItem('productos_cache', JSON.stringify(productos));
        } catch(e) { console.error("Error cargando online, usando caché:", e); obtenerCache(); }
      } else {
        obtenerCache();
      }
      renderProductos(productos);
    }

    function obtenerCache() {
      productos = JSON.parse(localStorage.getItem('productos_cache') || "[]");
    }

    function renderProductos(lista) {
      const contenedor = document.getElementById("lista-productos");
      contenedor.innerHTML = "";
      if (lista.length === 0) {
        contenedor.innerHTML = "<p style='text-align: center; color:#666;'>No hay productos registrados.</p>";
        return;
      }
      lista.forEach(prod => {
        const estaAgotado = parseInt(prod.stock || 0) <= 0;
        const item = document.createElement("div");
        item.className = `product-item ${estaAgotado ? 'out-of-stock' : ''}`;
        item.innerHTML = `
          <div>
            <strong>[${prod.id}] ${prod.nombre}</strong><br>
            <span class="material-text">${prod.material}</span> — <strong>$${prod.precio}</strong>
            <span style="font-size:12px; color:#666; margin-left:8px;">(Stock: ${prod.stock})</span>
          </div>
          <button class="btn-blue" ${estaAgotado ? 'disabled' : ''} onclick="agregarAlCarrito('${prod.id}')">${estaAgotado ? '❌' : '＋'}</button>
        `;
        contenedor.appendChild(item);
      });
    }

    function filtrarProductos() {
      const busqueda = document.getElementById("filtro-nombre").value.toLowerCase().trim();
      const material = document.getElementById("filtro-material").value;
      const filtrados = productos.filter(p => {
        const coincideTexto = p.id.toString().includes(busqueda) || p.nombre.toLowerCase().includes(busqueda);
        const coincideMat = material === "TODOS" || p.material === material;
        return coincideTexto && coincideMat;
      });
      renderProductos(filtrados);
    }

    function agregarAlCarrito(id) {
      const prod = productos.find(p => p.id.toString() === id.toString());
      if (!prod) return;
      const enCarrito = carrito.filter(item => item.id.toString() === id.toString()).length;
      if (enCarrito >= parseInt(prod.stock)) { alert("Stock insuficiente."); return; }
      carrito.push({...prod});
      actualizarCarrito();
    }

    function eliminarDelCarrito(index) {
      carrito.splice(index, 1);
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const lista = document.getElementById("carrito");
